<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111827" />
    <link rel="icon" type="image/png" href="" id="app-favicon" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Sofia+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>HBM Admin</title>
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet"
    />
    <script>
      function readBuildEnvValue(raw) {
        return raw && !/^%.*%$/.test(raw) ? raw : "";
      }

      const configuredSiteUrl = readBuildEnvValue("%VITE_SITE_URL%");
      const configuredFavicon = readBuildEnvValue("%VITE_FAVICON_URL%");
      const siteUrl = (configuredSiteUrl || window.location.origin).replace(/\/+$/, "");
      const favicon = configuredFavicon || `${siteUrl}/assets/logo.png`;

      document.getElementById("app-favicon")?.setAttribute("href", favicon);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
