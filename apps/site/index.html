<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Sofia+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />

    <title>The HBM - Bringing People Together</title>
    <meta
      name="description"
      content="Spark real connections in 8 minutes. Events, Meeter, and a movement for human connection."
    />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The HBM" />
    <meta property="og:title" content="The HBM - Bringing People Together" />
    <meta
      property="og:description"
      content="Spark real connections in 8 minutes. Events, Meeter, and a movement for human connection."
    />
    <meta property="og:image" content="" />
    <meta property="og:image:secure_url" content="" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="" />
    <meta property="og:locale" content="en_US" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="The HBM - Bringing People Together"
    />
    <meta
      name="twitter:description"
      content="Spark real connections in 8 minutes. Events, Meeter, and a movement for human connection."
    />
    <meta name="twitter:image" content="" />

    <link rel="manifest" href="/site.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <script>
      const siteUrl = window.location.origin.replace(/\/+$/, "");
      const ogImage = `${siteUrl}/og-default.png`;
      document.querySelector('meta[property="og:image"]')?.setAttribute("content", ogImage);
      document.querySelector('meta[property="og:image:secure_url"]')?.setAttribute("content", ogImage);
      document.querySelector('meta[property="og:url"]')?.setAttribute("content", `${siteUrl}/`);
      document.querySelector('meta[name="twitter:image"]')?.setAttribute("content", ogImage);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
