name: Deploy GCP

on:
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "apps/admin/**"
      - "apps/server/**"
      - "data/public-brand.js"
      - "scripts/build/**"
      - "package.json"
      - "package-lock.json"
      - "config/.nvmrc"
      - "apps/server/Dockerfile"
      - ".github/workflows/deploy-gcp.yml"
  workflow_dispatch:

concurrency:
  group: deploy-gcp-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-prod:
    name: Deploy Production Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'main'
    environment: production
    env:
      GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
      BACKEND_DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
      GCP_ARTIFACT_REGISTRY_REGION: ${{ vars.GCP_ARTIFACT_REGISTRY_REGION }}
      GCP_ARTIFACT_REGISTRY_REPOSITORY: ${{ vars.GCP_ARTIFACT_REGISTRY_REPOSITORY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site workspace
        run: npm run validate -w apps/site

      - name: Validate admin workspace
        run: npm run validate -w apps/admin

      - name: Validate backend workspace
        run: npm run validate -w apps/server

      - name: Apply backend Prisma migrations
        if: env.BACKEND_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.BACKEND_DATABASE_URL }}
        run: npm run prisma:migrate:deploy -w apps/server

      - name: Authenticate to Google Cloud
        if: env.GCP_CREDENTIALS_JSON != '' && env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' && env.GCP_CLOUD_RUN_SERVICE != '' && env.GCP_ARTIFACT_REGISTRY_REGION != '' && env.GCP_ARTIFACT_REGISTRY_REPOSITORY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_JSON }}

      - name: Setup gcloud
        if: env.GCP_CREDENTIALS_JSON != '' && env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' && env.GCP_CLOUD_RUN_SERVICE != '' && env.GCP_ARTIFACT_REGISTRY_REGION != '' && env.GCP_ARTIFACT_REGISTRY_REPOSITORY != ''
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build container image with Cloud Build
        id: build_image
        if: env.GCP_CREDENTIALS_JSON != '' && env.GCP_PROJECT_ID != '' && env.GCP_REGION != '' && env.GCP_CLOUD_RUN_SERVICE != '' && env.GCP_ARTIFACT_REGISTRY_REGION != '' && env.GCP_ARTIFACT_REGISTRY_REPOSITORY != ''
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY##*/}"
          IMAGE_URI="${GCP_ARTIFACT_REGISTRY_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REGISTRY_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"
          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          gcloud builds submit --tag "$IMAGE_URI" --file apps/server/Dockerfile .

      - name: Deploy image to Cloud Run
        if: steps.build_image.outputs.image_uri != ''
        run: |
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --image "${{ steps.build_image.outputs.image_uri }}" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --quiet

      - name: Skip notice when GCP config is missing
        if: env.GCP_CREDENTIALS_JSON == '' || env.GCP_PROJECT_ID == '' || env.GCP_REGION == '' || env.GCP_CLOUD_RUN_SERVICE == '' || env.GCP_ARTIFACT_REGISTRY_REGION == '' || env.GCP_ARTIFACT_REGISTRY_REPOSITORY == ''
        run: |
          echo "Skipping production deploy."
          echo "Set GCP_CREDENTIALS_JSON secret and GCP_PROJECT_ID, GCP_REGION, GCP_CLOUD_RUN_SERVICE, GCP_ARTIFACT_REGISTRY_REGION, GCP_ARTIFACT_REGISTRY_REPOSITORY variables to enable this job."
