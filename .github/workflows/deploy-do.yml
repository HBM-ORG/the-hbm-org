name: Deploy DigitalOcean

on:
  push:
    branches:
      - dev
      - staging
    paths:
      - "apps/site/**"
      - "apps/admin/**"
      - "apps/server/**"
      - "config/.nvmrc"
      - ".github/workflows/deploy-do.yml"
  workflow_dispatch:

concurrency:
  group: deploy-do-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-dev:
    name: Deploy Dev App Platform Apps
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'dev'
    environment: development
    env:
      DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
      DO_APP_ID_SITE: ${{ vars.DO_APP_ID_SITE }}
      DO_APP_ID_ADMIN: ${{ vars.DO_APP_ID_ADMIN }}
      DO_APP_ID_BACKEND: ${{ vars.DO_APP_ID_BACKEND }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed deployment targets
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'config/.nvmrc'
            admin:
              - 'apps/admin/**'
              - 'config/.nvmrc'
            backend:
              - 'apps/server/**'
              - 'config/.nvmrc'

      - name: Setup Node.js
        if: steps.changes.outputs.site == 'true' || steps.changes.outputs.admin == 'true' || steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/site/package-lock.json
            apps/admin/package-lock.json
            apps/server/package-lock.json

      - name: Build site workspace
        if: steps.changes.outputs.site == 'true'
        run: npm ci --prefix apps/site && npm --prefix apps/site run validate

      - name: Build admin workspace
        if: steps.changes.outputs.admin == 'true'
        run: npm ci --prefix apps/admin && npm --prefix apps/admin run validate

      - name: Validate backend workspace
        if: steps.changes.outputs.backend == 'true'
        run: npm ci --prefix apps/server && npm --prefix apps/server run validate

      - name: Prisma migration note
        if: steps.changes.outputs.backend == 'true'
        run: |
          echo "Skipping prisma migrate deploy from GitHub Actions for DO."
          echo "Reason: GitHub-hosted runners are outside the trusted network for the managed MySQL instance."
          echo "Run Prisma migrations from the backend App Platform deployment/runtime path instead."

      - name: Setup doctl
        if: env.DO_API_TOKEN != '' && (steps.changes.outputs.site == 'true' || steps.changes.outputs.admin == 'true' || steps.changes.outputs.backend == 'true')
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Trigger site deployment
        if: env.DO_API_TOKEN != '' && env.DO_APP_ID_SITE != '' && steps.changes.outputs.site == 'true'
        run: doctl apps create-deployment "$DO_APP_ID_SITE" --wait

      - name: Trigger admin deployment
        if: env.DO_API_TOKEN != '' && env.DO_APP_ID_ADMIN != '' && steps.changes.outputs.admin == 'true'
        run: doctl apps create-deployment "$DO_APP_ID_ADMIN" --wait

      - name: Trigger backend deployment
        if: env.DO_API_TOKEN != '' && env.DO_APP_ID_BACKEND != '' && steps.changes.outputs.backend == 'true'
        run: doctl apps create-deployment "$DO_APP_ID_BACKEND" --wait

      - name: Skip notice when no development DigitalOcean deployment is triggered
        if: env.DO_API_TOKEN == '' || (steps.changes.outputs.site != 'true' && steps.changes.outputs.admin != 'true' && steps.changes.outputs.backend != 'true')
        run: |
          echo "Skipping dev deploy."
          echo "Either no deploy-relevant files changed or DO_API_TOKEN is missing."

  deploy-staging:
    name: Deploy Staging App Platform Apps
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref_name == 'staging'
    environment: staging
    env:
      DO_API_TOKEN: ${{ secrets.DO_API_TOKEN }}
      DO_APP_ID_SITE: ${{ vars.DO_APP_ID_SITE }}
      DO_APP_ID_ADMIN: ${{ vars.DO_APP_ID_ADMIN }}
      DO_APP_ID_BACKEND: ${{ vars.DO_APP_ID_BACKEND }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed deployment targets
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            site:
              - 'apps/site/**'
              - 'config/.nvmrc'
            admin:
              - 'apps/admin/**'
              - 'config/.nvmrc'
            backend:
              - 'apps/server/**'
              - 'config/.nvmrc'

      - name: Setup Node.js
        if: steps.changes.outputs.site == 'true' || steps.changes.outputs.admin == 'true' || steps.changes.outputs.backend == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc
          cache: npm
          cache-dependency-path: |
            apps/site/package-lock.json
            apps/admin/package-lock.json
            apps/server/package-lock.json

      - name: Build site workspace
        if: steps.changes.outputs.site == 'true'
        run: npm ci --prefix apps/site && npm --prefix apps/site run validate

      - name: Build admin workspace
        if: steps.changes.outputs.admin == 'true'
        run: npm ci --prefix apps/admin && npm --prefix apps/admin run validate

      - name: Validate backend workspace
        if: steps.changes.outputs.backend == 'true'
        run: npm ci --prefix apps/server && npm --prefix apps/server run validate

      - name: Prisma migration note
        if: steps.changes.outputs.backend == 'true'
        run: |
          echo "Skipping prisma migrate deploy from GitHub Actions for DO."
          echo "Reason: GitHub-hosted runners are outside the trusted network for the managed MySQL instance."
          echo "Run Prisma migrations from the backend App Platform deployment/runtime path instead."

      - name: Setup doctl
        if: env.DO_API_TOKEN != '' && (steps.changes.outputs.site == 'true' || steps.changes.outputs.admin == 'true' || steps.changes.outputs.backend == 'true')
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Trigger site deployment
        if: env.DO_API_TOKEN != '' && env.DO_APP_ID_SITE != '' && steps.changes.outputs.site == 'true'
        run: doctl apps create-deployment "$DO_APP_ID_SITE" --wait

      - name: Trigger admin deployment
        if: env.DO_API_TOKEN != '' && env.DO_APP_ID_ADMIN != '' && steps.changes.outputs.admin == 'true'
        run: doctl apps create-deployment "$DO_APP_ID_ADMIN" --wait

      - name: Trigger backend deployment
        if: env.DO_API_TOKEN != '' && env.DO_APP_ID_BACKEND != '' && steps.changes.outputs.backend == 'true'
        run: doctl apps create-deployment "$DO_APP_ID_BACKEND" --wait

      - name: Skip notice when no staging DigitalOcean deployment is triggered
        if: env.DO_API_TOKEN == '' || (steps.changes.outputs.site != 'true' && steps.changes.outputs.admin != 'true' && steps.changes.outputs.backend != 'true')
        run: |
          echo "Skipping staging deploy."
          echo "Either no deploy-relevant files changed or DO_API_TOKEN is missing."
