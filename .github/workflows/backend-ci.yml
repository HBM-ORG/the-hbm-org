name: Backend CI

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - "apps/server/**"
      - "apps/server/Dockerfile"
      - "config/.nvmrc"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - "apps/server/**"
      - "apps/server/Dockerfile"
      - "config/.nvmrc"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/server

      - name: Validate backend workspace
        run: npm --prefix apps/server run validate
