name: Shared CI

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - "package.json"
      - "package-lock.json"
      - "config/**"
      - "scripts/build/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Shared Workspace Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
