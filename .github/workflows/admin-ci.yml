name: Admin CI

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - "apps/admin/**"
      - "config/.nvmrc"
      - ".github/workflows/admin-ci.yml"
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - "apps/admin/**"
      - "config/.nvmrc"
      - ".github/workflows/admin-ci.yml"
  workflow_dispatch:

concurrency:
  group: admin-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-admin:
    name: Validate Admin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix apps/admin

      - name: Validate admin workspace
        run: npm --prefix apps/admin run validate
