name: Site CI

on:
  push:
    branches:
      - dev
      - staging
      - main
    paths:
      - "apps/site/**"
      - "data/public-brand.js"
      - "scripts/build/**"
      - "package.json"
      - "package-lock.json"
      - "config/.nvmrc"
      - ".github/workflows/site-ci.yml"
  pull_request:
    branches:
      - dev
      - staging
      - main
    paths:
      - "apps/site/**"
      - "data/public-brand.js"
      - "scripts/build/**"
      - "package.json"
      - "package-lock.json"
      - "config/.nvmrc"
      - ".github/workflows/site-ci.yml"
  workflow_dispatch:

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-site:
    name: Validate Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: config/.nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate site workspace
        run: npm run validate -w apps/site
